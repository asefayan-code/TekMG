# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: TekMG
    runtime: static
    buildCommand: ""
    staticPublishPath: ./
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /
        destination: /aboutUs.aspx.html
