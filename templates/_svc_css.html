<style>
.sv-hero{max-width:1100px;margin:16px auto 0;padding:56px 16px;border-radius:10px;background:#1c2733;color:#fff;text-align:center}
.sv-hero h1{color:#fff;font-size:1.7rem;margin:0 0 12px;line-height:1.35}
.sv-hero p{margin:0 auto 20px;max-width:640px;font-size:1.05rem;line-height:1.65}
.sv-btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:6px;background:#a94e2c;color:#fff;font-weight:700;text-decoration:none}
.sv-btn.alt{background:#fff;color:#1c2733;margin-left:8px}
.sv-wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
.sv-wrap h2{text-align:center;color:#333;margin:34px 0 18px;font-size:1.5rem}
.sv-crumbs{max-width:1100px;margin:0 auto;padding:12px 16px 0;font-size:.85rem}
.sv-crumbs a{color:#555;text-decoration:none;padding:8px 0;display:inline-block}
.sv-chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sv-chips li{background:#eef3f8;border-radius:16px;padding:8px 14px}
.sv-cols{display:grid;grid-template-columns:1fr;gap:16px}
.sv-box{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px}
.sv-box h3{margin:0 0 10px;font-size:1.2rem;color:#0f62ac}
.sv-box ul{margin:0;padding-left:20px;line-height:1.9}
.sv-faq details{border-bottom:1px solid #ddd}
.sv-faq summary{cursor:pointer;padding:16px 28px 16px 0;font-weight:700;min-height:44px;position:relative;list-style:none}
.sv-faq summary::-webkit-details-marker{display:none}
.sv-faq summary:after{content:"+";position:absolute;right:4px;top:12px;font-size:1.4rem;color:#a94e2c}
.sv-faq details[open] summary:after{content:"\2212"}
.sv-faq p{margin:0 0 16px;line-height:1.65;color:#444}
.sv-cta{background:#eef3f8;border-radius:8px;padding:24px 16px;text-align:center;margin-top:34px}
@media(min-width:700px){.sv-cols{grid-template-columns:repeat(2,1fr)}.sv-hero h1{font-size:2.2rem}}
@media(max-width:480px){.sv-btn.alt{margin:10px 0 0}.sv-btn{width:100%;box-sizing:border-box}}
</style>
