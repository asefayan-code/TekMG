<style>
.lm-wrap{max-width:1000px;margin:0 auto;padding:0 16px 24px}
.lm-banner{background:#fff3cd;text-align:center;padding:10px 16px;font-weight:600;border-radius:10px;margin:12px 0}
.lm-crumbs{font-size:.9rem;margin:12px 0}
.lm-crumbs a{color:#0f3d62}
.lm-hero{background:#1c2733;color:#fff;text-align:center;padding:24px 16px;border-radius:14px;margin:12px 0}
.lm-hero h1{color:#fff;font-size:1.6rem;margin:0 0 8px;line-height:1.25}
.lm-hero p{margin:0;font-size:1rem}
.lm-card{background:#fff;border:1px solid #dde4ec;border-radius:14px;padding:16px 18px;margin:16px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.lm-card h2{margin:0 0 10px;font-size:1.3rem;color:#0f3d62}
.lm-card p{line-height:1.6;margin:0 0 8px}
.lm-card ul{margin:0;padding-left:22px;line-height:1.7}
.lm-facts{width:100%;border-collapse:collapse}
.lm-facts th,.lm-facts td{text-align:left;padding:8px 10px;border-bottom:1px solid #e3e8ee}
.lm-facts th{width:42%;color:#0f3d62}
.lm-go{text-align:center;margin:18px 0}
.lm-go a{display:inline-block;background:#15803d;color:#fff;font-weight:700;padding:14px 26px;border-radius:50px;text-decoration:none}
.lm-go a:hover{background:#166534}
.lm-faq details{background:#fff;border:1px solid #dde4ec;border-radius:8px;padding:8px 14px;margin:0 0 8px}
.lm-faq summary{font-weight:700;cursor:pointer;color:#0f3d62}
.lm-faq p{margin:8px 0 4px;line-height:1.6}
.lm-nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}
.lm-nav a{color:#0f3d62;font-weight:600}
.lm-grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr;gap:8px}
.lm-grid a{display:block;background:#fff;border:1px solid #dde4ec;border-radius:8px;padding:10px 12px;color:#0f3d62;font-weight:600;text-decoration:none}
.lm-grid a:hover{background:#eef3f8}
@media(min-width:600px){.lm-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.lm-grid{grid-template-columns:repeat(3,1fr)}}
</style>
